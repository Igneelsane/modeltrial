        const table = { cols: [cleaned.columns[0] ? cleaned.columns[0].header : 'Item', 'Stock', 'Reorder point', 'Shortfall'], rows: gaps.slice(0, 10).map(g => [g.sku, String(g.stock), String(g.reorder), String(g.short)]) };
        let insight = gaps.length
          ? gaps.length + ' of ' + total + ' items are below their reorder point' + (gaps[0] ? ' — e.g. ' + gaps[0].sku + ' (stock ' + gaps[0].stock + ' vs reorder ' + gaps[0].reorder + ')' : '') + '.'
          : 'All ' + total + ' items are at or above their reorder points.';
        return { kind: 'stock', table, value: gaps.length, unit: 'count', insight, formula: 'stock_qty < reorder_point per item', columns: this.cols, flags: flagsFor(cleaned), confidence: gaps.length ? 'high' : 'directional' };
      },
    };
  }

  function countsItem(idCol, timeCol, cleaned) {
    return {
      id: 'counts_' + idCol.index, title: 'Distinct ' + (idCol.identity === 'identifier' ? idCol.header : idCol.identity + 's') + ' per period', kind: 'counts',
      cols: { id: idCol.header, time: hdr(cleaned.columns, timeCol) },
      unit: 'count', computable: true,
      compute() {
        const rows = cleaned.rows.filter(r => dt(r, timeCol));
        const g = granFor(rows, timeCol);
        const periods = buckets(rows, timeCol, g).map(b => {
          const set = new Set();
          for (const r of b.rows) { const v = str(r, idCol.index); if (v != null) set.add(v); }
          return { period: b.label, value: set.size, n: b.rows.length };
        });
        const last = periods[periods.length - 1], prev = periods[periods.length - 2];
        const pct = prev && prev.value ? (last.value - prev.value) / prev.value * 100 : null;
        let insight = 'Distinct ' + (idCol.identity === 'identifier' ? idCol.header : idCol.identity + 's') + ': ' + last.value + ' in ' + last.period;
        if (pct != null) insight += ' — ' + (pct >= 0 ? 'up' : 'down') + ' ' + Math.abs(pct).toFixed(0) + '% vs ' + prev.period + ' (' + prev.value + ')';
        return { kind: 'counts', periods, value: last.value, unit: 'count', insight, formula: 'distinct count of ' + idCol.header + ' per ' + g + ' period', columns: this.cols, flags: flagsFor(cleaned), confidence: periods.length >= 3 ? 'high' : 'directional' };
      },
    };
  }

  function summaryItem(col, dim, timeCol, cleaned) {
    return {
      id: 'summary_' + col.index, title: titleize(col.header) + ' — distribution', kind: 'summary',
      cols: { metric: col.header },
      unit: col.unit, computable: true,
      compute() {
        const st = col.stats;
        if (!st) return null;
        // extremes with context (dimension value + period label of the extreme rows)
        let maxRow = null, minRow = null;
        for (const r of cleaned.rows) {
          const v = num(r, col.index); if (v === null) continue;
          if (!maxRow || v > num(maxRow, col.index)) maxRow = r;
          if (!minRow || v < num(minRow, col.index)) minRow = r;
        }
        const ctx = r => {
          const parts = [];
          if (dim) { const d = str(r, dim.index); if (d != null) parts.push(d); }
          if (timeCol) { const t = dt(r, timeCol); if (t) parts.push(t.toISOString().slice(0, 7)); }
          return parts.join(', ') || 'row';
        };
        const table = { cols: ['Stat', col.header], rows: [['Min', fmt(st.min, col.unit)], ['Max', fmt(st.max, col.unit)], ['Mean', fmt(st.mean, col.unit)], ['Median', fmt(st.median, col.unit)], ['Non-null rows', String(st.n)]] };
        const insight = col.header + ' ranges ' + fmt(st.min, col.unit) + '–' + fmt(st.max, col.unit) + ', mean ' + fmt(st.mean, col.unit) + ', median ' + fmt(st.median, col.unit) +
          (maxRow ? '. Highest: ' + fmt(num(maxRow, col.index), col.unit) + ' (' + ctx(maxRow) + ')' : '') +
          (minRow ? '; lowest: ' + fmt(num(minRow, col.index), col.unit) + ' (' + ctx(minRow) + ')' : '');
        return { kind: 'summary', table, value: st.mean, unit: col.unit, insight, formula: 'min / max / mean / median of ' + col.header, columns: this.cols, flags: flagsFor(cleaned), confidence: st.n >= 30 ? 'high' : 'directional' };
      },
    };
  }

  /* ── plan derivation (the heart: purely from the role profile) ── */
  function buildPlan(cleaned, roles) {
    const S = roles.summary, M = S.metrics;
    const items = [];
    const time = S.time[0] || null;
    const dims = S.dimensions;
    const allMetrics = [].concat(M.cost, M.revenue, M.volume, M.outcome, M.engagement, M.rate, M.plain, M.stock, M.reorder);
    const seen = new Set();
    const metrics = allMetrics.filter(m => (seen.has(m.index) ? false : (seen.add(m.index), true)));

    // 1. trends — only if a time column exists
    if (time && metrics.length) metrics.forEach(m => items.push(trendItem(m, time.index, cleaned)));
    else if (metrics.length) items.push({ id: 'trends', title: 'Trends over time', kind: 'trend', computable: false, why_not: 'No date column found — trends need a time dimension. Add a date column to unlock this.' });

    // 2. breakdowns — only if a dimension exists; primary metric per dimension
    for (const dim of dims) {
      const primary = M.outcome[0] || M.revenue[0] || M.volume[0] || M.engagement[0] || M.rate[0] || M.plain[0];
      if (primary) items.push(breakdownItem(dim, primary, cleaned));
    }
    if (!dims.length && metrics.length) items.push({ id: 'breakdowns', title: 'Breakdown by category', kind: 'breakdown', computable: false, why_not: 'No categorical dimension column found (e.g. channel, region, product) — add one to unlock segmentation analysis.' });

    // 3. efficiency — only if cost + outcome/revenue exist
    if (M.cost.length && M.outcome.length) items.push(efficiencyItem(M.cost[0], M.outcome[0], dims, cleaned, 'cpo'));
    else if (M.cost.length && !M.outcome.length) items.push({ id: 'cpo', title: 'Cost per outcome', kind: 'ratio', computable: false, why_not: 'Spend data exists (' + M.cost[0].header + ') but no outcome column (conversions, orders, …) — add one to unlock efficiency analysis.' });
    else if (!M.cost.length) items.push({ id: 'cpo', title: 'Cost per outcome', kind: 'ratio', computable: false, why_not: 'No cost/spend column found — efficiency (cost per outcome) cannot be computed.' });
    if (M.cost.length && M.revenue.length) items.push(efficiencyItem(M.cost[0], M.revenue[0], dims, cleaned, 'roas'));
    else if (M.cost.length && !M.revenue.length) items.push({ id: 'roas', title: 'Return on ad spend', kind: 'ratio', computable: false, why_not: 'Spend data exists but no revenue column — ROAS cannot be computed.' });

    // 4. rates — only if volume + outcome exist
    if (M.volume.length && M.outcome.length) {
      const out = M.outcome.find(m => !m.negative) || M.outcome[0];
      items.push(rateItem(M.volume[0], out, time ? time.index : null, cleaned, 'conversion'));
    }
    const negOuts = M.outcome.filter(m => m.negative);
    if (negOuts.length && M.volume.length) {
      for (const neg of negOuts) {
        const kind = /unsub/.test(neg.header) ? 'unsub' : 'bounce';
        items.push(rateItem(M.volume[0], neg, time ? time.index : null, cleaned, kind));
      }
    }
    // engagement rate — social data
    if (M.engagement.length && M.volume.length) items.push(rateItem(M.volume[0], M.engagement[0], time ? time.index : null, cleaned, 'engagement'));

    // 5. stock gaps — only if stock + reorder columns exist
    if (M.stock.length && M.reorder.length) items.push(stockItem(M.stock[0], M.reorder[0], cleaned));

    // 6. distinct counts — only if id + time exist
    if (time && S.ids.length) S.ids.forEach(idCol => items.push(countsItem(idCol, time.index, cleaned)));

    // 7. distribution summary for every metric
    metrics.forEach(m => items.push(summaryItem(m, dims[0] || null, time ? time.index : null, cleaned)));

    return items;
  }

  return { buildPlan, fmt, granFor, buckets };
})();

/* ===== propose.js ===== */
/* propose.js — decision proposals derived from computed results.
   Every proposal cites the actual numbers behind it. If the data cannot ground
   a decision, that is stated explicitly in the gaps list — we never force one. */

globalThis.KPI = globalThis.KPI || {};
KPI.propose = (function () {

  function generate(results, ctx) {
    const proposals = [];
    const gaps = [];
    const S = ctx.roles.summary, M = S.metrics;
    const sample = ctx.cleaned.rows.length;
    const cap = s => sample < 30 ? 'directional' : s;
    const has = a => a && a.length;
    const money = v => KPI.interpreter.fmtValue(v, 'currency');

    /* ── gaps: what this data cannot ground ── */
    if (!has(M.cost)) gaps.push({
      title: 'Cost efficiency & ROI',
      reason: 'No cost/spend column in this dataset — cost per outcome, ROAS and budget-allocation calls cannot be grounded here.',
      unlock: 'add a spend/cost column',
    });
    if (!has(M.outcome)) gaps.push({
      title: 'Outcome performance',
      reason: 'No outcome column (conversions, orders, goal completions, …) — the dataset cannot show what actions or results were produced.',
      unlock: 'add a conversions/orders/goals column',
    });
    if (!has(M.volume)) gaps.push({
      title: 'Funnel / reach analysis',
      reason: 'No volume column (impressions, sessions, sends, …) — rates like conversion % or engagement % cannot be computed.',
      unlock: 'add a traffic/volume column',
    });
    if (!S.time.length) gaps.push({
      title: 'Trends & direction',
      reason: 'No date column — nothing can be said about direction, seasonality, or momentum.',
      unlock: 'add a date column',
    });
    if (sample < 30) gaps.push({
      title: 'Statistical reliability',
      reason: 'Only ' + sample + ' rows — every figure here is directional. Treat the numbers as indications, not measurements.',
      unlock: 'a larger dataset',
    });

    /* ── proposals from computed results ── */
    const push = (title, kind, strength, evidence) => {
      proposals.push({ title, kind, strength: cap(strength), evidence: evidence.filter(Boolean) });
    };

    // 1. allocation — cost per outcome by channel/campaign
    const cpo = results.find(r => r.kind === 'ratio' && r.id && r.id.startsWith('cpo_'));
    if (cpo && cpo.rawRows && cpo.rawRows.length >= 3 && cpo.value != null) {
      const overall = cpo.value;
      const eligible = cpo.rawRows.filter(r => r.spend > 0 && r.share >= 0.08 && r.ratio != null);
      const best = eligible.slice().sort((a, b) => a.ratio - b.ratio)[0];
      const worst = eligible.slice().sort((a, b) => b.ratio - a.ratio)[0];
      if (best && best.ratio < 0.8 * overall) {
        push('Shift budget toward ' + best.name,
          'allocation', 'high',
          [best.name + ': ' + money(best.ratio) + ' per ' + cpo.columns.outcome.toLowerCase() + ' vs ' + money(overall) + ' average (' + Math.round((1 - best.ratio / overall) * 100) + '% cheaper), ' + best.out + ' outcomes across ' + money(best.spend) + ' spend',
           'Moving share of spend toward channels with a lower cost per outcome is the highest-leverage allocation visible in this data.']);
      }
      if (worst && worst.ratio > 1.6 * overall) {
        push('Review ' + worst.name + ' spend',
          'review', 'medium',
          [worst.name + ': ' + money(worst.ratio) + ' per ' + cpo.columns.outcome.toLowerCase() + ' vs ' + money(overall) + ' average (' + Math.round((worst.ratio / overall - 1) * 100) + '% more expensive), ' + Math.round(worst.share) + '% of spend',
           'Consider pausing or renegotiating before further budget is committed.']);
      }
    }

    // 2. ROAS by channel
    const roas = results.find(r => r.kind === 'ratio' && r.id && r.id.startsWith('roas_'));
    if (roas && roas.rawRows && roas.rawRows.length >= 3 && roas.value != null) {
      const overall = roas.value;
      const eligible = roas.rawRows.filter(r => r.spend > 0 && r.share >= 0.08);
      const best = eligible.slice().sort((a, b) => (b.out / b.spend) - (a.out / a.spend))[0];
      const worst = eligible.slice().sort((a, b) => (a.out / a.spend) - (b.out / b.spend))[0];
      const bestRoas = best ? best.out / best.spend : null;
      const worstRoas = worst ? worst.out / worst.spend : null;
      if (best && bestRoas >= 1.8 * overall) {
        push('Reallocate toward ' + best.name,
          'allocation', 'high',
          [best.name + ' returns ' + KPI.interpreter.fmtValue(bestRoas, 'ratio') + ' on every ₹1 vs ' + KPI.interpreter.fmtValue(overall, 'ratio') + ' overall — the strongest return in this dataset',
           'This is a numeric call, not a suggestion: at current efficiency the same budget would return ' + KPI.interpreter.fmtValue(bestRoas / overall, 'ratio') + '× more if shifted entirely.']);
      }
      if (worst && worstRoas != null && worstRoas <= 0.5 * overall) {
        push('Reassess ' + worst.name,
          'review', 'medium',
          [worst.name + ' returns only ' + KPI.interpreter.fmtValue(worstRoas, 'ratio') + ' per ₹1 vs ' + KPI.interpreter.fmtValue(overall, 'ratio') + ' overall (' + Math.round(worst.share) + '% of spend)',
           'Lowest-return line in the dataset — worth a targeting or creative review before more budget goes in.']);
      }
    }

    // 3. trend alerts on outcome metrics (direction-aware for negative outcomes:
    //    for unsubscribes/bounces a rise is bad, a drop is good)
    for (const m of M.outcome) {
      const t = results.find(r => r.kind === 'trend' && r.columns && r.columns.metric === m.header);
      if (t && t.periods && t.periods.length >= 2) {
        const last = t.periods[t.periods.length - 1], prev = t.periods[t.periods.length - 2];
        const pct = prev.value ? (last.value - prev.value) / prev.value * 100 : null;
        if (pct != null && Math.abs(pct) >= 15) {
          const worsening = m.negative ? pct > 0 : pct < 0;
          const what = m.negative ? 'rose' : 'dropped';
          const dirWord = m.negative ? 'up' : 'down';
          if (worsening) {
            push(m.header + ' ' + what + ' ' + Math.abs(pct).toFixed(0) + '% MoM — investigate',
              'investigate', 'high',
              [m.header + ' moved from ' + KPI.interpreter.fmtFull(prev.value, t.unit) + ' (' + prev.period + ') to ' + KPI.interpreter.fmtFull(last.value, t.unit) + ' (' + last.period + ')',
               'A single-period move of this size is an investigation trigger, not yet a verdict — check the contributing ' + (S.dimensions[0] ? S.dimensions[0].header : 'dimensions') + ' before acting.']);
          } else {
            push(m.header + ' ' + (m.negative ? 'dropped' : 'rose') + ' ' + Math.abs(pct).toFixed(0) + '% MoM — understand what worked',
              'sustain', 'medium',
              [m.header + ' moved from ' + KPI.interpreter.fmtFull(prev.value, t.unit) + ' (' + prev.period + ') to ' + KPI.interpreter.fmtFull(last.value, t.unit) + ' (' + last.period + ')',
               'Identify the driver before it drifts — a move this steep usually has an identifiable cause.']);
          }
        }
      }
    }

    // 4. concentration risk
    const bd = results.find(r => r.kind === 'breakdown' && r.topShare != null);
    if (bd && bd.topShare > 60) {
      push('Concentration risk: ' + bd.top + ' alone is ' + bd.topShare.toFixed(0) + '% of ' + (bd.columns.metric || 'the metric'),
        'risk', 'medium',
        ['' + bd.top + ': ' + bd.topShare.toFixed(0) + '% of ' + bd.columns.metric + ' — any change to this single ' + (bd.columns.dimension || 'segment') + ' moves the whole number',
         'Diversification decisions are yours, but the exposure is measurable in this data.']);
    }

    // 5. engagement rate — SELF-RELATIVE: flagged only against this dataset's own
    //    history (latest period vs its own average), never a universal threshold
    const eng = results.find(r => r.kind === 'rate' && r.title && /engagement rate/i.test(r.title));
    if (eng && eng.periods && eng.periods.length >= 3) {
      const pairs = eng.periods.filter(p => p.rate != null);
      if (pairs.length >= 3) {
        const mean = pairs.reduce((a, p) => a + p.rate, 0) / pairs.length;
        const last = pairs[pairs.length - 1];
        if (last.rate < 0.6 * mean) {
          push('Engagement trailing its own average (' + last.rate.toFixed(2) + '% vs ' + mean.toFixed(2) + '% average)',
            'review', 'medium',
            ['engagement rate: ' + last.rate.toFixed(2) + '% in ' + last.period + ' vs the dataset\u2019s own ' + mean.toFixed(2) + '% average across ' + pairs.length + ' periods',
             'flagged against this dataset\u2019s own history — no external benchmark is assumed.']);
        }
      }
    }

    // 6. bounce rate — SELF-RELATIVE: rising relative to its own history only
    const bounce = results.find(r => r.kind === 'rate' && r.title && /bounce rate/i.test(r.title));
    if (bounce && bounce.periods && bounce.periods.length >= 3) {
      const pairs = bounce.periods.filter(p => p.rate != null);
      if (pairs.length >= 3) {
        const mean = pairs.reduce((a, p) => a + p.rate, 0) / pairs.length;
        const last = pairs[pairs.length - 1];
        if (last.rate > 1.4 * mean) {
          push('Bounce rate rising relative to its own history (' + last.rate.toFixed(1) + '% vs ' + mean.toFixed(1) + '% average)',
            'review', 'medium',
            ['bounce rate: ' + last.rate.toFixed(1) + '% in ' + last.period + ' vs the dataset\u2019s own ' + mean.toFixed(1) + '% average across ' + pairs.length + ' periods',
             'a rising share of undeliverable addresses can cost sender reputation — but this flag is the dataset\u2019s own trend, not an external benchmark.']);
        }
      }
    }

    // 7. stock gaps
    const stock = results.find(r => r.kind === 'stock');
    if (stock && stock.value > 0) {
      push('Restock ' + stock.value + ' item' + (stock.value === 1 ? '' : 's') + ' below reorder point',
        'restock', 'high',
        [stock.value + ' of ' + ctx.cleaned.rows.length + ' items are below reorder point (see the stock table for exact shortfalls)',
         'Shortfall = reorder_point − stock_qty per item; the largest gaps are visible in the analysis above.']);
    }

    return { proposals, gaps };
  }

  return { generate };
})();

/* ===== exporter.js ===== */
/* exporter.js — client-side CSV export (PRD §10.5). */

globalThis.KPI = globalThis.KPI || {};
KPI.exporter = (function () {
  function esc(v) {
    const s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function buildCsv(results, cleaned) {
    const rows = [['kpi_id', 'kpi_name', 'source', 'period', 'value', 'unit', 'formula_text', 'source_columns', 'flags', 'interpretation']];
    for (const r of results) {
      const srcCols = Object.entries(r.source_columns || {})
        .map(([f, c]) => f + '=' + c).join('; ');
      const flagStr = (r.flags || []).join(', ');
      for (const p of r.periods || []) {
        rows.push([r.kpi_id, r.name, r.source, p.period, fmt(p.value), r.unit, r.formula_text, srcCols, flagStr, r.interpretation]);
      }
      if (r.single) {
        rows.push([r.kpi_id, r.name, r.source, 'overall', fmt(r.single.value), r.unit, r.formula_text, srcCols, flagStr, r.interpretation]);
      }
    }
    return rows.map(r => r.map(esc).join(',')).join('\n');
  }

  function fmt(v) { return v == null ? '' : (typeof v === 'number' ? Math.round(v * 1000) / 1000 : v); }

  function download(filename, csv) {
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  return { buildCsv, download };
})();

KPI.ui = (function () {

  /* ── 5. results ── */
  function sparkSvg(periods, unit) {
    const pts = (periods || []).filter(p => p.value != null).map(p => ({ v: p.value, label: p.period }));
    if (pts.length < 2) return '';
    const vals = pts.map(p => p.v);
    const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
    const W = 110, H = 30, P = 3;
    const x = i => P + (i * (W - 2 * P)) / (pts.length - 1);
    const y = v => H - P - ((v - min) / span) * (H - 2 * P);
    const points = pts.map((p, i) => x(i).toFixed(1) + ',' + y(p.v).toFixed(1)).join(' ');
    return '<svg class="sparkline" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">' +
      '<polyline points="' + points + '" fill="none" stroke="currentColor" stroke-width="1.4"/>' +
      '<circle cx="' + x(pts.length - 1).toFixed(1) + '" cy="' + y(pts[pts.length - 1].v).toFixed(1) + '" r="2.2" fill="currentColor"/></svg>';
  }

  function resultCard(res) {
    const val = KPI.interpreter.fmtFull(res.value, res.unit);
    let trend = '', table = '';
    if (res.kind === 'trend' || res.kind === 'counts') {
      if (res.periods && res.periods.length >= 2) {
        const last = res.periods[res.periods.length - 1], prev = res.periods[res.periods.length - 2];
        const pct = prev.value ? (last.value - prev.value) / prev.value * 100 : null;
        const dir = pct == null || Math.abs(pct) < 5 ? 'flat' : pct > 0 ? 'up' : 'down';
        const arrow = dir === 'up' ? '↑' : dir === 'down' ? '↓' : '→';
        trend = '<div class="kc-mid"><div class="trend ' + dir + '"><span class="tdelta">' + arrow + ' ' + (pct == null ? '—' : Math.abs(pct).toFixed(0) + '%') + '</span> vs prior period<span class="tnote">' + res.periods.length + ' periods' + (res.periods.length < 3 ? ' — no trend claimed' : '') + '</span></div>' + sparkSvg(res.periods, res.unit) + '</div>';
      }
    }
    if (res.table) {
      table = '<div class="tblwrap"><table class="tbl"><tr>' + res.table.cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr>' +
        res.table.rows.slice(0, 12).map(rr => '<tr>' + rr.map(c => '<td class="r mono">' + esc(c) + '</td>').join('') + '</tr>').join('') + '</table></div>';
    }
    const srcs = res.columns ? Object.entries(res.columns).map(([k, v]) => k + ' ← ' + v).join(' · ') : '';
    return '<div class="kpi-card">' +
      '<div class="kc-top"><span class="kc-name">' + esc(res.title || res.id) + '</span><span class="kc-src">' + esc(res.confidence || '') + '</span></div>' +
      '<div><div class="kc-value">' + val + '</div><div class="faint" style="margin-top:6px">' + esc(res.unit || '') + '</div></div>' +
      '<div class="kc-rule"></div>' + trend +
      '<div class="interp">' + esc(res.insight || '') + '</div>' +
      flagTags(res.flags) + table +
      '<div class="formula"><span class="flabel">Formula:</span>' + esc(res.formula || '') + '</div>' +
      (srcs ? '<div class="srcs"><b>Sources:</b> ' + srcs + '</div>' : '') +
      '</div>';
  }

  function results(state) {
    const r = state.results;
    const id = state.identification;
    const idStr = id.unclear ? 'uncertain — exploratory mode'
      : esc(id.label) + ' · ' + Math.round(id.confidence * 100) + '% evidence-weighted confidence';

    const cards = r.map(resultCard).join('');

    const propHtml = (p, i) => '<div class="proposal">' +
      '<div class="prop-top"><span class="prop-title">' + esc(p.title) + '</span><span class="prop-strength ' + p.strength + '">' + esc(p.strength) + '</span></div>' +
      '<ul class="prop-evidence">' + p.evidence.map(e => '<li>' + esc(e) + '</li>').join('') + '</ul>' +
      '<div class="prop-note">proposal — numbers are yours to act on, nothing runs automatically</div></div>';

    const gapsHtml = state.gaps.length
      ? state.gaps.map(g => '<div class="gap-item"><div class="gap-title">' + esc(g.title) + '</div>' +
        '<div class="gap-reason">' + esc(g.reason) + '</div>' +
        (g.unlock ? '<div class="gap-unlock">unlocked by: <code>' + esc(g.unlock) + '</code></div>' : '') + '</div>').join('')
      : '<p class="muted">No notable data gaps.</p>';

    return '<div class="card">' +
      '<div class="kicker">05 — Results</div>' +
      '<div class="result-head"><div><h2 style="margin-bottom:6px">' + esc(state.fileName) + '</h2>' +
      '<div class="meta">Identification — <b>' + idStr + '</b> · ' + state.cleaned.rows.length.toLocaleString('en-IN') + ' rows after cleaning<br>' +
      'Computed in <b>' + state.msElapsed + ' ms</b>, entirely in your browser — zero network calls.</div></div>' +
      '<button class="btn" onclick="KPI.app.exportCsv()">Export results (CSV)</button></div>' +
      '<div class="section-head"><span>Analysis — derived from your columns</span><span class="cnt">' + r.length + '</span></div>' +
      '<div class="kpi-grid">' + cards + '</div>' +
      '<div class="section-head" style="margin-top:34px"><span>What’s worth considering</span><span class="cnt">' + state.proposals.length + '</span></div>' +
      (state.proposals.length ? state.proposals.map(propHtml).join('') : '<p class="muted">Nothing rose above the evidence threshold — no proposal is forced.</p>') +
      '<div class="section-head" style="margin-top:34px"><span>What this data can’t tell us</span><span class="cnt">' + state.gaps.length + '</span></div>' +
      '<div class="gap-list">' + gapsHtml + '</div>' +
      '</div>' + logHtml(state.log);
  }

  function error(state) {
    return '<div class="card"><div class="kicker">Error</div><h2 style="font-size:22px">Could not process this file</h2>' +
      '<div class="notice warn"><b>What happened.</b> ' + esc(state.error) + '</div>' +
      '<div class="btn-row"><button class="btn" onclick="KPI.app.clearAll()">Try another file</button></div></div>';
  }

  function render(state) {
    const app = document.getElementById('app');
    let html = topbar(state) + '<div class="wrap">' + steps(state.screen);
    switch (state.screen) {
      case 'upload': html += upload(state); break;
      case 'preview': html += preview(state); break;
      case 'identify': html += identify(state); break;
      case 'plan': html += plan(state); break;
      case 'results': html += results(state); break;
      case 'error': html += error(state); break;
      default: html += '<p>…</p>';
    }
    html += '<footer class="footer">KPI Analyzer · identification-first · all computation client-side, zero network calls<br>' +
      'Every number carries its formula and source columns — proposals cite the numbers behind them, and what the data can’t ground is said out loud.</footer></div>';
    app.innerHTML = html;
    if (state.screen === 'upload') wireUpload();
    window.scrollTo(0, 0);
  }

  function wireUpload() {
    const dz = document.getElementById('dropzone');
    const fi = document.getElementById('fileInput');
    if (!dz || !fi) return;
    dz.addEventListener('click', () => fi.click());
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('over'));
    dz.addEventListener('drop', e => {
      e.preventDefault(); dz.classList.remove('over');
      if (e.dataTransfer.files.length) KPI.app.handleFile(e.dataTransfer.files[0]);
    });
    fi.addEventListener('change', () => { if (fi.files.length) KPI.app.handleFile(fi.files[0]); fi.value = ''; });
  }

  return { render };
})();

/* ===== app.js ===== */
/* app.js — state machine + pipeline orchestration.
   upload → inspect → identify (roles + characterization) → plan (derived) → results (+ proposals + gaps). */

globalThis.KPI = globalThis.KPI || {};
KPI.app = (function () {
  const state = {
    screen: 'upload',
    table: null, cleaned: null, roles: null, identification: null,
    plan: null, selected: {}, results: null, proposals: [], gaps: [],
    log: [], error: null, msElapsed: 0, fileName: '', lastText: null,
  };

  function addLog(level, msg) { state.log.push({ level, msg }); }
  function mergeWarnings(arr) { if (arr && arr.length) arr.forEach(w => addLog(w.level || 'info', w.msg)); }
  function render() { KPI.ui.render(state); }

  function handleFile(file) {
    state.log = []; state.error = null; state.fileName = file.name;
    const reader = new FileReader();
    reader.onerror = () => { state.error = 'Could not read the file.'; state.screen = 'error'; render(); };
    reader.onload = () => {
      try {
        const { text } = KPI.parser.decodeBytes(reader.result);
        ingestText(text, file.name, file.size);
      } catch (e) { state.error = e.message; state.screen = 'error'; render(); }
    };
    reader.readAsArrayBuffer(file);
  }

  function loadSample(key) {
    state.log = []; state.error = null;
    const s = KPI.samples[key];
    state.fileName = s.name;
    addLog('info', 'Loaded sample dataset: ' + s.name + '. ' + s.note);
    ingestText(s.csv, s.name, s.csv.length);
  }

  function ingestText(text, name, size) {
    state.lastText = text;
    const table = KPI.parser.parseCSVText(text);
    table.meta.fileName = name;
    table.meta.size = size;
    state.table = table;
    addLog('info', 'Parsed ' + table.meta.rowCount.toLocaleString('en-IN') + ' rows × ' + table.meta.colCount + ' columns (delimiter "' + table.meta.delimiter + '", ' + table.meta.encoding + ').');
    mergeWarnings(table.warnings);
    const cleaned = KPI.cleaner.cleanTable(table);
    state.cleaned = cleaned;
    mergeWarnings(cleaned.warnings);
    addLog('info', 'Type inference: ' + cleaned.columns.map(c => c.header + '→' + c.type).join(', '));
    state.screen = 'preview';
    render();
  }

  function reparse(useGenerated) {
    if (!state.lastText) return;
    try {
      state.log = [];
      const table = KPI.parser.parseCSVText(state.lastText, { forceHeader: !useGenerated });
      table.meta.fileName = state.fileName;
      state.table = table;
      mergeWarnings(table.warnings);
      state.cleaned = KPI.cleaner.cleanTable(table);
      mergeWarnings(state.cleaned.warnings);
      state.screen = 'preview';
      render();
    } catch (e) { state.error = e.message; state.screen = 'error'; render(); }
  }

  /* ── identification (the core step) ── */
  function runIdentify() {
    const roles = KPI.roles.assign(state.cleaned);
    state.roles = roles;
    const identification = KPI.identify.characterize(state.cleaned, roles);
    state.identification = identification;
    addLog('info', 'Column roles assigned: ' + roles.summary.time.length + ' time, ' + roles.summary.ids.length + ' identifier, ' + roles.summary.dimensions.length + ' dimension, ' +
      Object.entries(roles.summary.metrics).reduce((a, [k, v]) => a + v.length, 0) + ' metric (' +
      Object.entries(roles.summary.metrics).filter(([, v]) => v.length).map(([k, v]) => v.length + ' ' + k).join(', ') + ').');
    if (identification.unclear) addLog('warn', 'Could not confidently identify the dataset — proceeding in exploratory mode with the confirmed facets.');
    else addLog('info', 'Identified as: ' + identification.label + ' (confidence ' + Math.round(identification.confidence * 100) + '%, tier ' + identification.tier + '). Runner-up: ' + identification.runnerUp.label + '.');
    state.screen = 'identify';
    render();
  }

  function confirmIdentify() {
    // the label is informational only — the plan is derived from the column roles,
    // so overriding it never changes the analysis (only what we call the dataset).
    const sel = document.getElementById('archetypeSel');
    if (sel && sel.value !== 'unclear' && KPI.identify.ARCH[sel.value]) {
      const arch = KPI.identify.ARCH[sel.value];
      state.identification.archetype = sel.value;
      state.identification.label = arch.label;
      state.identification.desc = arch.desc;
      state.identification.unclear = false;
      addLog('info', 'Label overridden to: ' + arch.label + ' (informational — analysis is still derived from columns).');
    }
    state.plan = KPI.analyze.buildPlan(state.cleaned, state.roles);
    state.selected = {};
    for (const it of state.plan) if (it.computable) state.selected[it.id] = true;
    const computable = state.plan.filter(i => i.computable).length;
    addLog('info', 'Analysis plan derived from column evidence: ' + computable + ' computable, ' + (state.plan.length - computable) + ' not supported by this data.');
    state.screen = 'plan';
    render();
  }

  function toggleSelect(id, checked) { state.selected[id] = checked; }

  function runSelected() {
    const ids = state.plan.filter(i => i.computable && state.selected[i.id]).map(i => i.id);
    execute(ids);
  }
  function runAll() {
    const ids = state.plan.filter(i => i.computable).map(i => i.id);
    execute(ids);
  }

  function execute(ids) {
    if (!ids.length) { state.error = 'No analyses selected.'; state.screen = 'plan'; render(); return; }
    const t0 = performance.now();
    const results = [];
    for (const id of ids) {
      const item = state.plan.find(i => i.id === id);
      if (!item || !item.computable) continue;
      try {
        const res = item.compute();
        if (res) { res.id = item.id; res.title = res.title || item.title; results.push(res); addLog('info', id + ': computed (' + (res.periods ? res.periods.length + ' periods' : res.table ? 'table' : 'value') + ').'); }
      } catch (e) { addLog('error', id + ' failed: ' + e.message); }
    }
    state.results = results;
    const prop = KPI.propose.generate(results, { cleaned: state.cleaned, roles: state.roles, identification: state.identification });
    state.proposals = prop.proposals;
    state.gaps = prop.gaps;
    state.msElapsed = Math.round(performance.now() - t0);
    state.screen = 'results';
    render();
  }

  function exportCsv() {
    const rows = [['section', 'id', 'title', 'value', 'unit', 'insight', 'formula', 'sources', 'confidence', 'flags']];
    for (const r of state.results) {
      rows.push(['analysis', r.id, r.title || r.id, KPI.interpreter.fmtFull(r.value, r.unit), r.unit, r.insight, r.formula || '', Object.entries(r.columns || {}).map(([k, v]) => k + '=' + v).join('; '), r.confidence || '', (r.flags || []).join('; ')]);
    }
    for (const p of state.proposals) {
      rows.push(['proposal', '', p.title, '', p.strength, p.evidence.join(' | '), '', '', '', '']);
    }
    for (const g of state.gaps) {
      rows.push(['data_gap', '', g.title, '', '', g.reason + ' (unlocked by: ' + (g.unlock || '') + ')', '', '', '', '']);
    }
    const csv = rows.map(r => r.map(v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v)).join(',')).join('\n');
    const base = state.fileName.replace(/\.[^.]+$/, '') || 'dataset';
    KPI.exporter.download('kpi-results-' + base + '.csv', '\uFEFF' + csv);
  }

  function clearAll() {
    Object.assign(state, {
      screen: 'upload', table: null, cleaned: null, roles: null, identification: null,
      plan: null, selected: {}, results: null, proposals: [], gaps: [],
      log: [], error: null, msElapsed: 0, fileName: '', lastText: null,
    });
    render();
  }

  // beforeunload: generic browser prompt only — custom text is unsupported (v3.1 fix)
  window.addEventListener('beforeunload', e => {
    if (state.table) { e.preventDefault(); e.returnValue = ''; }
  });

  document.addEventListener('DOMContentLoaded', () => render());

  return { handleFile, loadSample, reparse, runIdentify, confirmIdentify, toggleSelect, runSelected, runAll, exportCsv, clearAll, state };
})();


</script>
</body>
</html>
